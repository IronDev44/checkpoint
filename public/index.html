<!DOCTYPE html>
<html lang="fr" data-theme="theme-checkpoint">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090a0c" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("checkpoint-startup-appearance") || "null");
          var theme = saved && /^theme-[a-z]+$/.test(saved.theme) ? saved.theme : localStorage.getItem("checkpoint-theme") || "theme-checkpoint";
          var isMatrix = theme === "theme-matrix";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "theme-checkpoint") {
            document.documentElement.style.backgroundColor = "#090a0c";
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#090a0c");
          }
          if (isMatrix) {
            document.documentElement.style.backgroundColor = "#000302";
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", "#000302");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      html[data-theme="theme-checkpoint"], html[data-theme="theme-checkpoint"] body, html[data-theme="theme-checkpoint"] #root { background:#090a0c; }

      html[data-theme="theme-matrix"],
      html[data-theme="theme-matrix"] body,
      html[data-theme="theme-matrix"] #root {
        min-height: 100dvh;
        background:
          linear-gradient(180deg, #000704 0%, #000604 54%, #000302 100%),
          repeating-linear-gradient(0deg, rgba(134, 239, 172, 0.045) 0 1px, transparent 1px 28px);
        background-color: #000604;
      }

      @supports (-webkit-touch-callout: none) {
        html[data-theme="theme-matrix"],
        html[data-theme="theme-matrix"] body,
        html[data-theme="theme-matrix"] #root {
          min-height: -webkit-fill-available;
        }
      }
    </style>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <meta
      name="description"
      content="Checkpoint - Suivi de jeux, wishlist, favoris, avis, progression, top 5 et sorties"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Checkpoint</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = document.documentElement.getAttribute("data-theme") || "theme-checkpoint";
          document.body.setAttribute("data-theme", theme);
          if (theme === "theme-matrix") document.body.style.backgroundColor = "#000302";
        } catch (e) {}
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
